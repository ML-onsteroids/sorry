<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sorry ❤️</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .box {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      position: relative;
      z-index: 1;
    }

    /* Panda emoji styling */
    .panda-emoji {
      font-size: 50px;
      margin-bottom: 15px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h2 {
      margin-bottom: 30px;
    }

    /* button container for spacing */
    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px; /* spacing between buttons */
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      font-weight: bold;
    }

    #no {
      background: #ccc;
      transition: top 0.2s, left 0.2s, transform 0.2s;
    }

    .heart {
      position: fixed;
      color: red;
      animation: float 5s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh); opacity: 1; }
      to { transform: translateY(-10vh); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="box">
  <div class="panda-emoji">🐼😘</div>
  <h2>Will you forgive me? 💖</h2>

  <div class="btn-group">
    <button id="yes" onclick="yesClicked()">Yes ❤️</button>
    <button id="no">No 🙈</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  let scale = 1;
  let rotation = 0;
  let isFirstMove = true;

  noBtn.addEventListener("mouseover", moveButton);
  noBtn.addEventListener("click", moveButton);

  function moveButton() {
    if (isFirstMove) {
      noBtn.style.position = "fixed";
      isFirstMove = false;
    }

    const btnWidth = noBtn.offsetWidth;
    const btnHeight = noBtn.offsetHeight;

    const maxX = window.innerWidth - btnWidth;
    const maxY = window.innerHeight - btnHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    scale *= 0.95;
    if (scale < 0.85) scale = 0.85;

    rotation += 15;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = `scale(${scale}) rotate(${rotation}deg)`;
  }

  function yesClicked() {
    document.body.innerHTML = `
      <div style="text-align:center;">
        <h1>Yayyy ❤️😍</h1>
        <p>I knew you'd say YES 😏</p>
        <p>Your lovely Abhishek 💖</p>
      </div>
    `;
  }

  // Floating hearts effect
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }, 300);
</script>

</body>
</html>
